services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules   # keep the container's node_modules, not your host's
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true