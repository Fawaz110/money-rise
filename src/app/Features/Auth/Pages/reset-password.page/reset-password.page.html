<div class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-6 text-text">
    <div class="relative w-full max-w-sm rounded-xl border border-border
           bg-bg-card p-5 shadow-xl backdrop-blur-xl sm:p-6">
        <div class="mb-5 flex justify-center">
            <img src="./logo/logo-lg.png" alt="Moneyrise" class="h-auto w-32" />
        </div>
        <div class="mb-4 flex justify-center">
            <div class="flex h-10 w-10 items-center justify-center rounded-full
               bg-green-base/10 text-green-base">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7"
                    stroke="currentColor" class="h-5 w-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.5 10.5V6.75 a4.5 4.5 0 0 0-9 0v3.75 m-.75 0h10.5 A1.75 1.75 0 0 1 19 12.25v6 A1.75 1.75 0 0 1 17.25 20H6.75 A1.75 1.75 0 0 1 5 18.25v-6 a1.75 1.75 0 0 1 1.75-1.75Z" />
                </svg>
            </div>
        </div>
        <div class="mb-5 text-center">
            <h1 class="text-lg font-semibold tracking-tight text-text">Reset your password</h1>
            <p class="mx-auto mt-1.5 max-w-[280px] text-xs leading-5 text-text-secondary">Create a new password to
                secure your Moneyrise account.</p>
        </div>

        <!-- Form -->
        <form class="space-y-3.5">

            <!-- New Password -->
            <div>
                <label for="password" class="mb-1.5 block text-xs font-medium text-text-secondary">
                    New password
                </label>

                <div class="relative">
                    <input id="password" type="password" autocomplete="new-password"
                        placeholder="Enter your new password" class="h-10 w-full rounded-md border border-border
                   bg-bg-input px-3 pr-10 text-xs text-text outline-none
                   placeholder:text-text-muted
                   transition-all duration-200
                   hover:border-green-base/40
                   focus:border-green-base
                   focus:ring-2 focus:ring-green-base/15" />
                    <!-- Show password -->
                    <button type="button" aria-label="Show password" class="absolute right-2.5 top-1/2 -translate-y-1/2
                   rounded p-1 text-text-muted
                   transition-colors
                   hover:text-text
                   focus:outline-none
                   focus:text-green-base">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                            stroke="currentColor" class="h-4 w-4">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5
                   c4.478 0 8.268 2.943 9.542 7
                   -1.274 4.057-5.064 7-9.542 7
                   -4.477 0-8.268-2.943-9.542-7Z" />

                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0
                   3 3 0 0 1 6 0Z" />
                        </svg>
                    </button>
                </div>
            </div>


            <!-- Confirm Password -->
            <div>
                <label for="confirmPassword" class="mb-1.5 block text-xs font-medium text-text-secondary">
                    Confirm password
                </label>
                <div class="relative">
                    <input id="confirmPassword" type="password" autocomplete="new-password"
                        placeholder="Confirm your new password" class="h-10 w-full rounded-md border border-border
                   bg-bg-input px-3 pr-10 text-xs text-text outline-none
                   placeholder:text-text-muted
                   transition-all duration-200
                   hover:border-green-base/40
                   focus:border-green-base
                   focus:ring-2 focus:ring-green-base/15" />

                    <!-- Show password -->
                    <button type="button" aria-label="Show password" class="absolute right-2.5 top-1/2 -translate-y-1/2
                   rounded p-1 text-text-muted
                   transition-colors
                   hover:text-text
                   focus:outline-none
                   focus:text-green-base">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                            stroke="currentColor" class="h-4 w-4">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5
                   c4.478 0 8.268 2.943 9.542 7
                   -1.274 4.057-5.064 7-9.542 7
                   -4.477 0-8.268-2.943-9.542-7Z" />

                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0
                   3 3 0 0 1 6 0Z" />
                        </svg>
                    </button>
                </div>
            </div>


            <!-- Password Requirements -->
            <div class="rounded-lg border border-border bg-bg-input/40 px-3 py-2.5">
                <p class="mb-1.5 text-[10px] font-medium text-text-secondary">
                    Your password should contain:
                </p>

                <div class="grid grid-cols-2 gap-x-3 gap-y-1">

                    <div class="flex items-center gap-1.5 text-[10px] text-text-muted">
                        <div class="text-green-base relative flex items-center justify-center">
                            <svg class="absolute min-w-2 size-2" fill="currentColor" viewBox="-2.4 -2.4 28.80 28.80" id="check-mark-circle-2"
                                data-name="Flat Line" xmlns="http://www.w3.org/2000/svg"
                                transform="rotate(0)">
                                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"
                                    stroke="currentColor" stroke-width="0.096"></g>
                                <g id="SVGRepo_iconCarrier">
                                    <polyline id="primary" points="21 5 12 14 8 10"
                                        stroke="currentColor" style="fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;">
                                    </polyline>
                                    <path id="primary-2" data-name="primary"
                                        d="M20.94,11A8.26,8.26,0,0,1,21,12a9,9,0,1,1-9-9,8.83,8.83,0,0,1,4,1"
                                        stroke="currentColor" style="fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;">
                                    </path>
                                </g>
                            </svg>
                            <span class="min-w-1.5 size-1.5 rounded-full bg-green-base"></span>
                        </div>  
                        At least 6 characters
                    </div>

                    <div class="flex items-center gap-1.5 text-[10px] text-text-muted">
                        <div class="text-green-base relative flex items-center justify-center">
                            <svg class="absolute min-w-2 size-2" fill="currentColor" viewBox="-2.4 -2.4 28.80 28.80" id="check-mark-circle-2"
                                data-name="Flat Line" xmlns="http://www.w3.org/2000/svg"
                                transform="rotate(0)">
                                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"
                                    stroke="currentColor" stroke-width="0.096"></g>
                                <g id="SVGRepo_iconCarrier">
                                    <polyline id="primary" points="21 5 12 14 8 10"
                                        stroke="currentColor" style="fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;">
                                    </polyline>
                                    <path id="primary-2" data-name="primary"
                                        d="M20.94,11A8.26,8.26,0,0,1,21,12a9,9,0,1,1-9-9,8.83,8.83,0,0,1,4,1"
                                        stroke="currentColor" style="fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;">
                                    </path>
                                </g>
                            </svg>
                            <span class="min-w-1.5 size-1.5 rounded-full bg-green-base"></span>
                        </div>  
                        One uppercase letter
                    </div>

                    <div class="flex items-center gap-1.5 text-[10px] text-text-muted">
                        <div class="text-green-base relative flex items-center justify-center">
                            <svg class="absolute min-w-2 size-2" fill="currentColor" viewBox="-2.4 -2.4 28.80 28.80" id="check-mark-circle-2"
                                data-name="Flat Line" xmlns="http://www.w3.org/2000/svg"
                                transform="rotate(0)">
                                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"
                                    stroke="currentColor" stroke-width="0.096"></g>
                                <g id="SVGRepo_iconCarrier">
                                    <polyline id="primary" points="21 5 12 14 8 10"
                                        stroke="currentColor" style="fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;">
                                    </polyline>
                                    <path id="primary-2" data-name="primary"
                                        d="M20.94,11A8.26,8.26,0,0,1,21,12a9,9,0,1,1-9-9,8.83,8.83,0,0,1,4,1"
                                        stroke="currentColor" style="fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;">
                                    </path>
                                </g>
                            </svg>
                            <span class="min-w-1.5 size-1.5 rounded-full bg-green-base"></span>
                        </div>  
                        One number
                    </div>

                    <div class="flex items-center gap-1.5 text-[10px] text-text-muted">
                        <div class="text-green-base relative flex items-center justify-center">
                            <svg class="absolute min-w-2 size-2" fill="currentColor" viewBox="-2.4 -2.4 28.80 28.80" id="check-mark-circle-2"
                                data-name="Flat Line" xmlns="http://www.w3.org/2000/svg"
                                transform="rotate(0)">
                                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"
                                    stroke="currentColor" stroke-width="0.096"></g>
                                <g id="SVGRepo_iconCarrier">
                                    <polyline id="primary" points="21 5 12 14 8 10"
                                        stroke="currentColor" style="fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;">
                                    </polyline>
                                    <path id="primary-2" data-name="primary"
                                        d="M20.94,11A8.26,8.26,0,0,1,21,12a9,9,0,1,1-9-9,8.83,8.83,0,0,1,4,1"
                                        stroke="currentColor" style="fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2;">
                                    </path>
                                </g>
                            </svg>
                            <span class="min-w-1.5 size-1.5 rounded-full bg-green-base"></span>
                        </div>  
                        One special character
                    </div>
                </div>
            </div>
            <!-- Reset Button -->
            <button type="submit" class="h-10 w-full rounded-md bg-green-base px-4
               text-xs font-semibold text-slate-900
               transition-all duration-200
               hover:bg-green-light
               focus:outline-none
               focus:ring-2 focus:ring-green-base/30
               active:scale-[0.99]">
                Reset password
            </button>

        </form>


        <!-- Back to Login -->
        <div class="mt-5 text-center">
            <a routerLink="/auth/login" class="inline-flex items-center gap-1 text-[11px]
               font-medium text-text-muted
               transition-colors hover:text-green-base">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                    stroke="currentColor" class="h-3.5 w-3.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                </svg>
                Back to sign in
            </a>
        </div>

    </div>
</div>
