<div class="toast-container" aria-label="Notifications" aria-live="polite" aria-relevant="additions">
    @for (toast of _ToastService.toasts(); track toast.id) {
    <article class="toast" [class.toast-success]="toast.type === 'success'" [class.toast-error]="toast.type === 'error'"
        [class.toast-warning]="toast.type === 'warning'" [class.toast-info]="toast.type === 'info'"
        [attr.role]="toast.type === 'error' ? 'alert' : 'status'">
        <span class="toast-icon" aria-hidden="true">

            @case ('success') {

                        fill="currentColor"></path>
                </g>
            </svg>
            }
            @case ('error') {
            <svg fill="currentColor" height="20px" width="20px" version="1.1" id="Layer_1"
                xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512"
                xml:space="preserve">
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                <g id="SVGRepo_iconCarrier">
                    <g>
                        <g>
                            <g>
                                <path
                                    d="M437.016,74.984c-99.979-99.979-262.075-99.979-362.033,0.002c-99.978,99.978-99.978,262.073,0.004,362.031 c99.954,99.978,262.05,99.978,362.029-0.002C536.995,337.059,536.995,174.964,437.016,74.984z M406.848,406.844 c-83.318,83.318-218.396,83.318-301.691,0.004c-83.318-83.299-83.318-218.377-0.002-301.693 c83.297-83.317,218.375-83.317,301.691,0S490.162,323.549,406.848,406.844z">
                                </path>
                                <path
                                    d="M361.592,150.408c-8.331-8.331-21.839-8.331-30.17,0l-75.425,75.425l-75.425-75.425c-8.331-8.331-21.839-8.331-30.17,0 s-8.331,21.839,0,30.17l75.425,75.425L150.43,331.4c-8.331,8.331-8.331,21.839,0,30.17c8.331,8.331,21.839,8.331,30.17,0 l75.397-75.397l75.419,75.419c8.331,8.331,21.839,8.331,30.17,0c8.331-8.331,8.331-21.839,0-30.17l-75.419-75.419l75.425-75.425 C369.923,172.247,369.923,158.74,361.592,150.408z">
                                </path>
                            </g>
                        </g>
                    </g>
                </g>
            </svg>
            }
            @case ('warning') {
            <svg width="20px" height="20px" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>

                                fill="currentColor"></path>
                        </g>
                    </g>
                </g>
            </svg>
            }
            @default {
            <svg width="20px" height="20px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                <g id="SVGRepo_iconCarrier">
                    <path d="M12 17V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
                    <circle cx="1" cy="1" r="1" transform="matrix(1 0 0 -1 11 9)" fill="currentColor"></circle>
                    <path
                        d="M7 3.33782C8.47087 2.48697 10.1786 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 10.1786 2.48697 8.47087 3.33782 7"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
                </g>
            </svg>
            }
            }
        </span>
        <div class="toast-content">
            <strong>{{ toast.title }}</strong>
            <p>{{ toast.message }}</p>
        </div>

        <button type="button" class="toast-close" aria-label="Dismiss notification"
            (click)="_ToastService.dismiss(toast.id)">
            &times;
        </button>

        @if (toast.duration > 0) {
        <div class="toast-progress" [style.--toast-duration]="toast.duration + 'ms'"></div>
        }
    </article>
    }
</div>
