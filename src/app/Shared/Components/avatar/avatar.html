<div class="uppercase relative flex items-center justify-center
               overflow-hidden rounded-full
               bg-green-base/10 text-sm font-semibold text-green-base" [ngClass]="getAvatarSize() + ' ' + getAvatarBorder() ">
    <span>{{getAvatarLetters()}}</span>
    @if (dot) {
    <span class="absolute bottom-0.5 right-0.5 h-3 w-3 rounded-full
                     border-2 border-bg-card bg-green-base"></span>
    }
</div>
